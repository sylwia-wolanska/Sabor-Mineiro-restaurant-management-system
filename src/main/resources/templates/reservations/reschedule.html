<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Reschedule Reservation — Sabor Mineiro</title></head>
<body>
<section>
    <div class="page-header">
        <h1>Reschedule Reservation</h1>
        <p>Choose a new date and time for your reservation</p>
    </div>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <h2>Current Reservation</h2>
        <div class="summary-box">
            <div class="summary-row">
                <span class="label">Reservation #</span>
                <span class="value" th:text="${reservation.id()}">1</span>
            </div>
            <div class="summary-row">
                <span class="label">Current Date &amp; Time</span>
                <span class="value"
                      th:text="${#temporals.format(reservation.dateTime(), 'dd/MM/yyyy HH:mm')}">
                    15/01/2024 19:00
                </span>
            </div>
            <div class="summary-row">
                <span class="label">Guests</span>
                <span class="value"
                      th:text="${reservation.countOfPeople()} + ' people'">4 people</span>
            </div>
            <div class="summary-row">
                <span class="label">Table</span>
                <span class="value"
                      th:text="'Table #' + ${reservation.tableId()}">Table #2</span>
            </div>
            <div class="summary-row">
                <span class="label">Status</span>
                <span class="badge"
                      th:classappend="'badge-' + ${#strings.toLowerCase(reservation.reservationStatus())}"
                      th:text="${reservation.reservationStatus()}">ACCEPTED</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>New Date &amp; Time</h2>
        <form th:action="@{/reservations/{id}/reschedule(id=${reservation.id()})}"
              method="post">
            <div class="form-group">
                <label for="dateTime">New Date and Time</label>
                <input type="datetime-local"
                       id="dateTime"
                       name="dateTime"
                       th:attr="min=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd''T''HH:mm')}"
                       required/>
                <small style="color:var(--cinza); font-size:0.82rem;
                               margin-top:0.4rem; display:block;">
                    The system will automatically find the best available table for
                    <strong th:text="${reservation.countOfPeople()}">4</strong> guest(s).
                </small>
            </div>
            <div class="actions">
                <a th:href="@{/reservations}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-secondary">Next →</button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
