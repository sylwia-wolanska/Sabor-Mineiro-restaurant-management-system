<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Create Account — Sabor Mineiro</title></head>
<body>
<section>
    <div style="max-width:520px; margin:3rem auto;">

        <div class="page-header">
            <h1>Create Account</h1>
            <p>Join Sabor Mineiro to place orders and make reservations</p>
        </div>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <div class="card">
            <form th:action="@{/register}" method="post">

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                    <div class="form-group">
                        <label for="name">First Name</label>
                        <input type="text" id="name" name="name"
                               th:value="${form != null ? form.name : ''}"
                               placeholder="Maria" required/>
                    </div>
                    <div class="form-group">
                        <label for="surname">Last Name</label>
                        <input type="text" id="surname" name="surname"
                               th:value="${form != null ? form.surname : ''}"
                               placeholder="Silva" required/>
                    </div>
                </div>

                <div class="form-group">
                    <label for="emailAddress">Email Address</label>
                    <input type="email" id="emailAddress" name="emailAddress"
                           th:value="${form != null ? form.emailAddress : ''}"
                           placeholder="maria@example.com" required/>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="text" id="phoneNumber" name="phoneNumber"
                           th:value="${form != null ? form.phoneNumber : ''}"
                           placeholder="31987654321" required/>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           th:value="${form != null ? form.username : ''}"
                           placeholder="Choose a username" required/>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="At least 6 characters" required/>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="Repeat your password" required/>
                </div>

                <button type="submit" class="btn btn-primary"
                        style="width:100%; margin-top:0.5rem;">
                    Create Account
                </button>
            </form>
        </div>

        <div style="text-align:center; margin-top:1rem; color:var(--cinza); font-size:0.9rem;">
            Already have an account?
            <a th:href="@{/login}"
               style="color:var(--verde); font-weight:700; text-decoration:none;">
                Sign in here
            </a>
        </div>
    </div>
</section>
</body>
</html>
