<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Login — Sabor Mineiro</title></head>
<body>
<section>
    <div style="max-width:420px; margin:3rem auto;">

        <div class="page-header">
            <h1>Sign In</h1>
            <p>Welcome back to Sabor Mineiro</p>
        </div>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

        <div class="card">
            <form th:action="@{/login}" method="post">

                <input type="hidden" name="redirect" th:value="${redirect}"/>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username" required autofocus/>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" required/>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">
                    Sign In
                </button>
            </form>
        </div>

        <div style="text-align:center; margin-top:1rem; color:var(--cinza); font-size:0.9rem;">
            Don't have an account?
            <a th:href="@{/register}"
               style="color:var(--verde); font-weight:700; text-decoration:none;">
                Create one here
            </a>
        </div>

        <div class="alert alert-info" style="margin-top:2rem; font-size:0.85rem;">
            <strong>Demo accounts:</strong><br/>
            Client: <code>mariana</code> / <code>password123</code><br/>
            Chef: <code>chef.wagner</code> / <code>password123</code><br/>
            Waiter: <code>carlos</code> / <code>password123</code><br/>
            Driver: <code>rodrigo</code> / <code>password123</code>
        </div>
    </div>
</section>
</body>
</html>
