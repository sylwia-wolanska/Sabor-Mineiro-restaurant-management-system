<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:replace="${title}">Sabor Mineiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --verde:      #2d5a27;
            --verde-claro:#4a8c42;
            --amarelo:    #f5c842;
            --terracota:  #c1440e;
            --creme:      #fdf6ec;
            --marrom:     #3d2008;
            --cinza:      #6b7280;
            --branco:     #ffffff;
            --sombra:     0 4px 24px rgba(61,32,8,0.10);
            --radius:     12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--creme);
            color: var(--marrom);
            min-height: 100vh;
        }

        nav {
            background: var(--verde);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.18);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--amarelo);
            text-decoration: none;
            letter-spacing: 0.02em;
        }

        .nav-brand span { color: var(--branco); font-style: italic; }

        .nav-links {
            display: flex;
            gap: 0.25rem;
            list-style: none;
        }

        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.15);
            color: var(--amarelo);
        }

        .container {
            max-width: 1100px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .page-header {
            margin-bottom: 2rem;
            border-bottom: 3px solid var(--amarelo);
            padding-bottom: 1rem;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--verde);
        }

        .page-header p { color: var(--cinza); margin-top: 0.25rem; font-size: 0.95rem; }

        .wizard-steps {
            display: flex;
            gap: 0;
            margin-bottom: 2.5rem;
            background: var(--branco);
            border-radius: var(--radius);
            padding: 1rem 1.5rem;
            box-shadow: var(--sombra);
            align-items: center;
        }

        .wizard-step { display: flex; align-items: center; gap: 0.5rem; flex: 1; }

        .step-number {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #e5e7eb; color: var(--cinza);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
        }

        .wizard-step.active .step-number { background: var(--verde); color: var(--branco); }
        .wizard-step.done   .step-number { background: var(--amarelo); color: var(--marrom); }

        .step-label { font-size: 0.85rem; font-weight: 600; color: var(--cinza); }
        .wizard-step.active .step-label { color: var(--verde); }
        .wizard-step.done   .step-label { color: var(--marrom); }

        .step-divider { height: 2px; flex: 0.5; background: #e5e7eb; margin: 0 0.5rem; }

        .card {
            background: var(--branco);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--sombra);
            margin-bottom: 1.5rem;
        }

        .card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--verde);
            margin-bottom: 1.25rem;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }

        th {
            background: var(--verde); color: var(--branco);
            padding: 0.75rem 1rem; text-align: left;
            font-weight: 600; font-size: 0.85rem;
            letter-spacing: 0.05em; text-transform: uppercase;
        }

        th:first-child { border-radius: 8px 0 0 0; }
        th:last-child  { border-radius: 0 8px 0 0; }

        td { padding: 0.75rem 1rem; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafaf8; }

        .btn {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.6rem 1.4rem; border-radius: 8px; border: none;
            cursor: pointer; font-family: 'Nunito', sans-serif;
            font-weight: 700; font-size: 0.9rem;
            text-decoration: none; transition: all 0.2s; letter-spacing: 0.02em;
        }

        .btn-primary   { background: var(--verde);     color: var(--branco); }
        .btn-primary:hover { background: var(--verde-claro); transform: translateY(-1px); }

        .btn-secondary { background: var(--amarelo);   color: var(--marrom); }
        .btn-secondary:hover { background: #e8b800; transform: translateY(-1px); }

        .btn-danger    { background: var(--terracota); color: var(--branco); }
        .btn-danger:hover { opacity: 0.88; }

        .btn-outline   { background: transparent; color: var(--verde); border: 2px solid var(--verde); }
        .btn-outline:hover { background: var(--verde); color: var(--branco); }

        .btn-sm { padding: 0.35rem 0.9rem; font-size: 0.82rem; }

        .form-group { margin-bottom: 1.25rem; }

        label {
            display: block; font-weight: 700;
            margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--marrom);
        }

        input[type="text"], input[type="number"], input[type="datetime-local"],
        input[type="time"], input[type="email"], input[type="password"],
        select, textarea {
            width: 100%; padding: 0.65rem 1rem;
            border: 2px solid #e5e7eb; border-radius: 8px;
            font-family: 'Nunito', sans-serif; font-size: 0.95rem;
            color: var(--marrom); background: var(--branco);
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--verde);
        }

        .alert {
            padding: 1rem 1.25rem; border-radius: 8px;
            margin-bottom: 1.25rem; font-weight: 600; font-size: 0.92rem;
        }

        .alert-error   { background: #fef2f2; color: #991b1b; border-left: 4px solid var(--terracota); }
        .alert-success { background: #f0fdf4; color: #166534; border-left: 4px solid var(--verde-claro); }
        .alert-info    { background: #fefce8; color: #854d0e; border-left: 4px solid var(--amarelo); }

        .badge {
            display: inline-block; padding: 0.25rem 0.65rem;
            border-radius: 999px; font-size: 0.75rem;
            font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
        }

        .badge-initialized    { background: #e0f2fe; color: #0369a1; }
        .badge-in_preparation { background: #fef9c3; color: #854d0e; }
        .badge-completed      { background: #dcfce7; color: #166534; }
        .badge-cancelled      { background: #fee2e2; color: #991b1b; }
        .badge-accepted       { background: #dcfce7; color: #166534; }
        .badge-ongoing        { background: #fef9c3; color: #854d0e; }
        .badge-rescheduled    { background: #e0f2fe; color: #0369a1; }

        .summary-box {
            background: var(--creme); border: 2px solid var(--amarelo);
            border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem;
        }

        .summary-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.5rem 0; border-bottom: 1px dashed #d1d5db;
        }

        .summary-row:last-child { border-bottom: none; }
        .summary-row .label { color: var(--cinza); font-size: 0.9rem; }
        .summary-row .value { font-weight: 700; color: var(--marrom); }

        .total-row {
            background: var(--verde); color: var(--branco);
            padding: 0.75rem 1rem; border-radius: 8px;
            display: flex; justify-content: space-between;
            margin-top: 1rem; font-weight: 700; font-size: 1.05rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .menu-card {
            background: var(--branco); border: 2px solid #e5e7eb;
            border-radius: var(--radius); padding: 1.25rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .menu-card:hover { border-color: var(--verde-claro); box-shadow: var(--sombra); }
        .menu-card h3 { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--marrom); margin-bottom: 0.5rem; }
        .menu-card .meta { font-size: 0.82rem; color: var(--cinza); margin-bottom: 0.75rem; }
        .menu-card .price { font-size: 1.1rem; font-weight: 700; color: var(--verde); margin-bottom: 0.75rem; }

        .qty-input { display: flex; align-items: center; gap: 0.5rem; }
        .qty-input input { width: 70px; text-align: center; }

        footer {
            text-align: center; padding: 2rem; color: var(--cinza);
            font-size: 0.85rem; border-top: 1px solid #e5e7eb; margin-top: 3rem;
        }

        .success-icon {
            width: 72px; height: 72px; background: var(--verde);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 1.5rem;
            font-size: 2rem; color: white;
        }

        .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.5rem; }

        .detail-row { display: flex; gap: 1rem; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .detail-row .detail-label { color: var(--cinza); min-width: 160px; font-weight: 600; }
    </style>
</head>
<body>

<nav>
    <a class="nav-brand" th:href="@{/}">Sabor <span>Mineiro</span></a>

    <ul class="nav-links">
        <li><a th:href="@{/orders}">Orders</a></li>
        <li><a th:href="@{/reservations}">Reservations</a></li>
        <li><a th:href="@{/menu}">Menu</a></li>
        <li th:if="${loggedInPerson != null and loggedInPerson.role == 'MANAGER'}">
            <a th:href="@{/employees}">Employees</a>
        </li>
    </ul>

    <div style="display:flex; align-items:center; gap:1rem;">

        <div th:if="${loggedInPerson != null}"
             style="display:flex; align-items:center; gap:1rem;">

            <span style="color:rgba(255,255,255,0.85); font-size:0.88rem;">
                Hello,
                <strong style="color:var(--amarelo);"
                        th:text="${loggedInPerson.name}">
                    User
                </strong>
                <span style="background:rgba(255,255,255,0.15); padding:0.15rem 0.5rem;
                             border-radius:999px; font-size:0.75rem; margin-left:0.3rem;"
                      th:text="${loggedInPerson.role}">
                    CLIENT
                </span>
            </span>

            <a th:if="${loggedInPerson.role == 'CLIENT'}"
               th:href="@{/orders/new}"
               style="color:var(--amarelo); text-decoration:none;
                      font-weight:700; font-size:0.85rem;">
                + Order
            </a>
            <a th:if="${loggedInPerson.role == 'CLIENT'}"
               th:href="@{/reservations/new}"
               style="color:var(--amarelo); text-decoration:none;
                      font-weight:700; font-size:0.85rem;">
                + Reservation
            </a>

            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit"
                        style="background:rgba(255,255,255,0.15);
                               border:1px solid rgba(255,255,255,0.3);
                               color:white; padding:0.35rem 0.9rem;
                               border-radius:8px; cursor:pointer;
                               font-size:0.82rem; font-family:inherit;">
                    Sign Out
                </button>
            </form>
        </div>

        <div th:unless="${loggedInPerson != null}"
             style="display:flex; gap:0.5rem;">
            <a th:href="@{/login}"
               style="color:rgba(255,255,255,0.85); text-decoration:none;
                      padding:0.5rem 1rem; border-radius:8px;
                      font-weight:600; font-size:0.9rem;">
                Sign In
            </a>
            <a th:href="@{/register}"
               style="background:var(--amarelo); color:var(--marrom);
                      text-decoration:none; padding:0.5rem 1rem;
                      border-radius:8px; font-weight:700; font-size:0.9rem;">
                Register
            </a>
        </div>
    </div>
</nav>

<div class="container">
    <th:block th:replace="${content}"/>
</div>

<footer>
    Traditional Cuisine from Minas Gerais
</footer>

</body>
</html>
