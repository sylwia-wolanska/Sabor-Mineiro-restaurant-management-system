<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Order Confirmed — Sabor Mineiro</title></head>
<body>
<section>
    <div class="card" style="text-align:center; padding:3rem 2rem;">
        <div class="success-icon">✓</div>
        <h1 style="font-family:'Playfair Display',serif; color:var(--verde); font-size:2rem; margin-bottom:0.5rem;">
            Order Placed!
        </h1>
        <p style="color:var(--cinza); margin-bottom:2rem;">Your order has been received and is being processed.</p>

        <div class="summary-box" style="text-align:left; max-width:400px; margin:0 auto 2rem;">
            <div class="summary-row">
                <span class="label">Order Number</span>
                <span class="value">#<span th:text="${orderId}">1</span></span>
            </div>
            <div class="summary-row">
                <span class="label">Total</span>
                <span class="value" style="color:var(--verde); font-size:1.2rem;">
                    R$ <span th:text="${#numbers.formatDecimal(totalPrice, 1, 2)}">84.00</span>
                </span>
            </div>
            <div class="summary-row">
                <span class="label">Estimated preparation time</span>
                <span class="value" style="color:var(--terracota);">
                    <span th:text="${estimatedTime}">30</span> minutes
                </span>
            </div>
            <div class="summary-row">
                <span class="label">Status</span>
                <span class="badge badge-initialized">INITIALIZED</span>
            </div>
        </div>

        <div class="actions" style="justify-content:center;">
            <a th:href="@{/orders}"     class="btn btn-outline">View All Orders</a>
            <a th:href="@{/orders/new}" class="btn btn-primary">Place Another Order</a>
        </div>
    </div>
</section>
</body>
</html>
