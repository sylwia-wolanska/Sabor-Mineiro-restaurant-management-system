<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Order Summary — Sabor Mineiro</title></head>
<body>
<section>
    <div class="page-header">
        <h1>Order Summary</h1>
        <p>Review your selected dishes</p>
    </div>

    <div class="wizard-steps">
        <div class="wizard-step done">
            <div class="step-number">✓</div>
            <div class="step-label">Select Dishes</div>
        </div>
        <div class="step-divider"></div>
        <div class="wizard-step active">
            <div class="step-number">2</div>
            <div class="step-label">Summary</div>
        </div>
        <div class="step-divider"></div>
        <div class="wizard-step">
            <div class="step-number">3</div>
            <div class="step-label">Delivery</div>
        </div>
        <div class="step-divider"></div>
        <div class="wizard-step">
            <div class="step-number">4</div>
            <div class="step-label">Confirm</div>
        </div>
    </div>

    <div class="card">
        <h2>Selected Items</h2>
        <table>
            <thead>
            <tr>
                <th>Dish</th>
                <th>Prep Time</th>
                <th>Unit Price</th>
                <th>Qty</th>
                <th>Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${summaryItems}">
                <td><strong th:text="${entry.key.name()}">Feijao Tropeiro</strong></td>
                <td th:text="${entry.key.preparationTime()} + ' min'">30 min</td>
                <td>R$ <span th:text="${#numbers.formatDecimal(entry.key.price(), 1, 2)}">42.00</span></td>
                <td th:text="${entry.value}">2</td>
                <td>R$ <span th:text="${#numbers.formatDecimal(entry.key.price() * entry.value, 1, 2)}">84.00</span></td>
            </tr>
            </tbody>
        </table>

        <div class="summary-box" style="margin-top:1.5rem;">
            <div class="summary-row">
                <span class="label">Estimated preparation time</span>
                <span class="value"
                      th:text="${estimatedPrepTime} + ' minutes'">30 minutes</span>
            </div>
            <div class="total-row">
                <span>Order Total</span>
                <span>R$ <span th:text="${#numbers.formatDecimal(totalPrice, 1, 2)}">84.00</span></span>
            </div>
        </div>
    </div>

    <form th:action="@{/orders/new/pickup-options}" method="post">
        <div class="actions">
            <button type="submit" name="action" value="modify" class="btn btn-outline">
                ← Modify
            </button>
            <button type="submit" name="action" value="next" class="btn btn-primary">
                Next →
            </button>
        </div>
    </form>
</section>
</body>
</html>
