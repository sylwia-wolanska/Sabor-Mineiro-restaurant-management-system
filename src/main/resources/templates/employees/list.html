<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Employees — Sabor Mineiro</title></head>
<body>
<section>
    <div class="page-header">
        <h1>Employees</h1>
        <p>Manage restaurant staff</p>
    </div>

    <div style="margin-bottom:1.5rem;">
        <a th:href="@{/employees/new}" class="btn btn-primary">+ Add Employee</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error"   th:if="${error}"   th:text="${error}"></div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Role</th>
                <th>Salary / hr</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id()}">1</td>
                <td th:text="${emp.name() + ' ' + emp.surname()}">Wagner Carvalho</td>
                <td>
                    <span class="badge badge-accepted"
                          th:text="${emp.role()}">CHEF</span>
                </td>
                <td>R$ <span th:text="${#numbers.formatDecimal(emp.salaryPerHour(), 1, 2)}">55.00</span></td>
                <td>
                    <form th:if="${emp.role() != 'MANAGER'}"
                          th:action="@{/employees/{id}/delete(id=${emp.id()})}"
                          method="post"
                          onsubmit="return confirm('Remove this employee?')">
                        <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                    </form>
                    <span th:if="${emp.role() == 'MANAGER'}"
                          style="color:var(--cinza); font-size:0.85rem;">—</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="5" style="text-align:center; color:var(--cinza); padding:2rem;">
                    No employees found.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
