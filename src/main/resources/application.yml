spring:
  application:
    name: grm-server
  profiles:
    default: dev
  messages:
    basename: messages
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  sql:
    init:
      mode: never

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: native